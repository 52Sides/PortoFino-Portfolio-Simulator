name: Docker Compose CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  docker_compose_tests:
    runs-on: ubuntu-latest

    steps:
      # ---------------- Checkout ----------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- Create .env_secret ----------------
      - name: Create .env_secret for CI
        run: |
          cat <<EOF > .env_secret
          SECRET_KEY=ci-secret-key
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          SESSION_SECRET=ci-session-secret
          EOF

      # ---------------- Docker Buildx ----------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all services
        run: docker compose build --no-cache

      # ---------------- Start infra ----------------
      - name: Start infrastructure
        run: docker compose up -d postgres redis zookeeper kafka prometheus

      - name: Wait for healthy state
        run: |
          for i in {1..25}; do
            unhealthy=$(docker inspect --format='{{.Name}} {{.State.Health.Status}}' $(docker ps -q) | grep -v healthy || true)
            if [ -z "$unhealthy" ]; then
              echo "All containers healthy"
              break
            fi
            echo "Still waiting ($i/25)"
            echo "$unhealthy"
            sleep 15
          done

      # ---------------- Start app services ----------------
      - name: Start backend, worker, frontend, grafana
        run: docker compose up -d backend worker frontend grafana

      # ---------------- Wait backend ----------------
      - name: Wait for backend
        run: |
          ready=0
          for i in {1..20}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "Backend ready"
              ready=1
              break
            fi
            echo "Waiting for backend"
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "Backend did not become ready"
            exit 1
          fi

      # ---------------- Wait frontend ----------------
      - name: Wait for frontend fully loaded
        run: |
          ready=0
          for i in {1..30}; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:5173/ || true)
            if [ "$STATUS" = "200" ]; then
              echo "Frontend HTML ready"
              ready=1
              break
            fi
            echo "Waiting for frontend HTML ($i/30)"
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "Frontend did not become ready"
            exit 1
          fi

          echo "Waiting for React JS to initialize..."
          sleep 10

      # ---------------- Backend tests ----------------
      - name: Run backend tests
        run: docker compose exec backend pytest --disable-warnings --cov=src --cov-report=term-missing

      # ---------------- Seed E2E market data ----------------
      - name: Seed market data for E2E tests
        run: |
          docker compose exec -T postgres psql -U postgres -d portofino_db <<'SQL'
          INSERT INTO assets (ticker, date, open, high, low, close, volume)
          SELECT
            'AAPL',
            d::date,
            100 + n,
            101 + n,
            99 + n,
            100 + n,
            1000000
          FROM generate_series('2020-01-01'::date, '2020-12-31'::date, interval '1 day') WITH ORDINALITY AS t(d, n)
          ON CONFLICT (ticker, date) DO NOTHING;
          SQL
          docker compose exec -T postgres psql -U postgres -d portofino_db -c "SELECT ticker, COUNT(*) FROM assets WHERE ticker = 'AAPL' GROUP BY ticker;"
          docker compose exec -T worker celery -A services.worker.celery_app inspect active_queues

      # ---------------- Install Node + Playwright locally ----------------
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright + deps
        run: |
          npm ci
          npx playwright install --with-deps
        working-directory: frontend

      # ---------------- Run E2E tests on runner ----------------
      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=line
        working-directory: frontend

      # ---------------- Upload report ----------------
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      # ---------------- Diagnostics ----------------
      - name: Show docker logs on failure
        if: failure()
        run: docker compose logs backend worker kafka frontend prometheus grafana

      # ---------------- Tear down ----------------
      - name: Tear down environment
        if: always()
        run: docker compose down --remove-orphans -v
